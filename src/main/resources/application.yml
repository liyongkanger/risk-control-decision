spring:
  application:
    name: risk-control-decision
  profiles:
    default: local

liteflow:
  rule-source: flow.el.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RISK_DB_URL:jdbc:mysql://localhost:3306/risk_control_decision?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${RISK_DB_USERNAME:root}
    password: ${RISK_DB_PASSWORD:}
  data:
    redis:
      host: ${RISK_REDIS_HOST:localhost}
      port: ${RISK_REDIS_PORT:6379}
      password: ${RISK_REDIS_PASSWORD:}
      database: ${RISK_REDIS_DATABASE:0}
