spring:
  application:
    name: risk-control-decision
  datasource:
    url: ${RISK_DB_URL:jdbc:mysql://localhost:3306/risk_control_decision}
    username: ${RISK_DB_USERNAME:root}
    password: ${RISK_DB_PASSWORD:}
  data:
    redis:
      host: ${RISK_REDIS_HOST:localhost}
      port: ${RISK_REDIS_PORT:6379}
      password: ${RISK_REDIS_PASSWORD:}
      database: ${RISK_REDIS_DATABASE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
